# Gradle properties for the Vedika chat Android SDK.
#
# Stable AGP for current toolchain. AGP 8.5+ requires JDK 17, which
# matches our toolchain. Kotlin and Android target SDK match the
# upstream SDK floor (23 / 34).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
